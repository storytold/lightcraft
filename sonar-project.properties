sonar.projectKey=storytold_lightcraft
sonar.organization=storytold
sonar.coverage.exclusions=**/tools/**,**/docs/**,**/examples/**

# Setting sonar.tests without sonar.sources stops the scanner defaulting to the whole repository,
# which left only the packaging test indexed and the main branch analysed as empty. Sources and
# tests both start at the root; sonar.test.inclusions picks out the test files, so they are
# analysed as tests (outside production metrics and coverage) rather than left out.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/tests.rs,**/tests_*.rs,**/*_tests.rs,**/test_*.py
sonar.python.coverage.reportPaths=python-coverage.xml
