# Offline training tool, not part of the product or the workspace: reads raw files with LightCraft's own decoder
# so the training data is normalised exactly as the app normalises it before AI Denoise.
[package]
name = "lc-denoise-rawdump"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
lightcraft-raw = { path = "../../../crates/raw" }
serde_json = "1"
lightcraft-denoise = { path = "../../../crates/denoise", features = ["runtime"] }
