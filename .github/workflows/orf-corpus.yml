name: Olympus ORF corpus

on:
  pull_request:
    paths:
      - "crates/raw/**"
      - "crates/tiff/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "xtask/Cargo.toml"
      - "xtask/src/corpus_orf.rs"
      - "xtask/src/main.rs"
      - "docs/orf-corpus.json"
      - ".github/workflows/orf-corpus.yml"
  push:
    branches: [main]
    paths:
      - "xtask/src/corpus_orf.rs"
      - "xtask/src/main.rs"
      - "crates/raw/**"
      - "crates/tiff/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "xtask/Cargo.toml"
      - "docs/orf-corpus.json"
      - ".github/workflows/orf-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orf-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensor-checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 4
      RUST_TEST_THREADS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      LIGHTCRAFT_REQUIRE_ORF_CORPUS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch only hash-pinned CC0 Olympus files
        run: cargo xtask corpus --download --orf-only
      - name: Check complete sensors and older camera compatibility
        run: cargo test -p lightcraft-raw --locked --test corpus corpus_olympus_sensor_checksums -- --nocapture
