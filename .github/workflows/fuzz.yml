# Nightly long-run fuzzing (docs/ci.md, docs/testing-sil.md): every pure-Rust fuzz target for 30 minutes in one
# job — `cargo xtask fuzz all --parallel` builds each target in turn, then runs all seven at once (single-threaded
# each), with the CC0 corpus downloaded once as extra seeds. A crash fails the job and uploads each crashing
# target's inputs (target/fuzz/crashes/<target>/) plus the per-target logs; fold each input into that format's
# table-driven hostile-input test with the fix. Manual dispatch can shorten the run.
name: Fuzz

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:
    inputs:
      secs:
        description: "Seconds per target"
        default: "1800"

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    runs-on: [self-hosted, Linux, X64, lcc]
    timeout-minutes: 90 # build (~15 min cold) + the 30-minute time box + corpus download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Keep the downloaded corpus on the runner between runs
        # checkout cleans ignored files, so without this every run downloads all 532 raws again
        run: |
          mkdir -p corpus
          for d in raw video people; do mkdir -p "$HOME/.cache/lcc-corpus/$d"; rm -rf "corpus/$d"; ln -sfn "$HOME/.cache/lcc-corpus/$d" "corpus/$d"; done
      - name: CC0 corpus (extra seeds; the run falls back on built-in seeds without it)
        continue-on-error: true
        timeout-minutes: 15
        run: cargo xtask corpus --download
      - name: Fuzz all targets in parallel
        run: cargo xtask fuzz all --parallel --secs ${{ inputs.secs || '1800' }} --rng ${{ github.run_id }}
      - name: Upload crash inputs and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: |
            target/fuzz/crashes/
            target/fuzz/logs/
          if-no-files-found: ignore
