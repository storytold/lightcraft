# TEMPORARY (dropped before merge): run the engine and catalog tests on Windows and macOS.
name: tmp verify fix-ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.head_ref == 'claude/fix-main-ci-freebsd'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked -p lightcraft-engine -p lightcraft-catalog --lib --no-fail-fast
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
