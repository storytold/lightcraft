[package]
name = "dac-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "The app in the browser: the egui UI compiled to WASM (build with `cargo xtask web`)"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dac-brand = { workspace = true }
dac-engine = { workspace = true }
dac-ui-egui = { workspace = true }
dac-codecs = { workspace = true }
dac-raster = { workspace = true }
dac-preview = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
crc32fast = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "glow"] }
egui = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "DedicatedWorkerGlobalScope",
    "Document",
    "DomStringList",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "FileSystemCreateWritableOptions",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemRemoveOptions",
    "FileSystemWritableFileStream",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbKeyRange",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Location",
    "MessageEvent",
    "Navigator",
    "Performance",
    "StorageManager",
    "Url",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "WritableStream",
] }

[features]
# Open HEIC/HEIF photos (the optional dac-heif crate). Not default so distributors choose
# it (HEVC patents); build with `--features heif` to include it. On wasm32 panics abort, so
# heic-rs's `catch_unwind` guard does not apply there.
heif = ["dac-codecs/heif"]
