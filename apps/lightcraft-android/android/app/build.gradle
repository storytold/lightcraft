plugins {
    id 'com.android.application'
}

android {
    compileSdk = 35

    defaultConfig {
        applicationId = "ai.storyteller.lightcraft"
        minSdk = 31
        targetSdk = 35
        versionCode = 1
        versionName = "0.13.0"
    }

    sourceSets {
        main {
            // The output directory of
            // `cargo ndk -t arm64-v8a -o apps/lightcraft-android/jniLibs build --release -p lightcraft-android`
            jniLibs.srcDirs = ['../../jniLibs']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // Debug signing for local testing, so the release APK installs with `adb install -r`.
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace = 'ai.storyteller.lightcraft'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // GameActivity (not NativeActivity): eframe's Android backend needs it for input and IME.
    implementation "androidx.games:games-activity:4.4.0"
}
