[package]
name = "dac-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Font database, text shaping and layout (parley; complex scripts, CJK, vertical type) and glyph rasterization (L1). Ported from PhotoCraft's text crate"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# No `system` feature: fontique's system backend links fontconfig on Linux. We scan font
# directories ourselves (native) and always register the bundled fonts (native + web).
parley = { version = "0.11", default-features = false, features = ["std"] }
skrifa = "0.44"

# ICU dictionary data for Japanese word boundaries and complex-script line breaking. Native
# only: the CJK dictionary alone is 3.8 MB of wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parley = { version = "0.11", default-features = false, features = ["std", "complex-scripts"] }

[dev-dependencies]
serde_json = { workspace = true }
