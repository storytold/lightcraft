[package]
name = "lightcraft-cameras"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft cameras (L0): cameras and phones that don't mount as a disk (PTP/MTP), read through the operating system's own driver (Windows Portable Devices, macOS ImageCaptureCore). The workspace's second crate allowed `unsafe` (system calls, isolated in `wpd` and `ica`)."

# Opts out of the workspace lints only to keep `unsafe_code = "deny"` overridable for the two system
# modules below, exactly like `crates/sysmem`; every other crate root has `#![forbid(unsafe_code)]`.
# See AGENTS.md ("`unsafe` lives only in …").
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Devices_PortableDevices",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "block2", "objc2"] }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSDate", "NSError", "NSObjCRuntime", "NSRunLoop", "NSString", "NSThread", "NSTimeZone", "block2"] }
objc2-image-capture-core = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "ICCameraDevice",
    "ICCameraFile",
    "ICCameraFolder",
    "ICCameraItem",
    "ICDevice",
    "ICDeviceBrowser",
] }

[[test]]
name = "main_thread"
harness = false
