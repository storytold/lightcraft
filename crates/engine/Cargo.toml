[package]
name = "dac-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
dac-brand = { workspace = true }
dac-engine-core = { workspace = true }
dac-engine-develop = { workspace = true }
dac-engine-library = { workspace = true }
dac-geom = { workspace = true }
dac-color = { workspace = true }
dac-raster = { workspace = true }
dac-develop = { workspace = true }
dac-scenes = { workspace = true }
dac-pipeline = { workspace = true }
dac-gpu = { workspace = true }
dac-catalog = { workspace = true }
web-time = { workspace = true }
dac-preview = { workspace = true }
dac-codecs = { workspace = true }
dac-raw = { workspace = true }
dac-denoise-core = { workspace = true }
dac-denoise = { workspace = true, optional = true }
dac-meta = { workspace = true }
dac-faces = { workspace = true }
miniz_oxide = { workspace = true }
dac-merge = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.12", default-features = false, features = ["std"] }
unicode-segmentation = "1.13"
dac-segment = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dac-fetch = { workspace = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:dac-segment"]
denoise = ["dep:dac-denoise", "dac-denoise/runtime", "dac-gpu/denoise"]
rawnind-model = ["denoise", "dac-denoise/rawnind-model", "dac-denoise-core/rawnind-model"]

[dev-dependencies]
libc = { workspace = true }
dac-tiff = { workspace = true }
