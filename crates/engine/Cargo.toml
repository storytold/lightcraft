[package]
name = "lcc-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
# Paths stored in a Lightroom catalog: local files or the catalog's share (the fork also follows other shares).
craft-docpath = { workspace = true }
lcc-filters = { workspace = true }
lcc-brand = { workspace = true }
lcc-geom = { workspace = true }
lcc-color = { workspace = true }
lcc-raster = { workspace = true }
half = { workspace = true } # HDR view textures (`hdr_texture`): f32 → f16 texels
lcc-develop = { workspace = true }
lcc-scenes = { workspace = true }
lcc-pipeline = { workspace = true }
lcc-gpu = { workspace = true }
# the memory the process may use (cgroup limits on Linux) for the budget
lcc-sysmem = { workspace = true }
lcc-catalog = { workspace = true }
lcc-geo = { workspace = true }
lcc-hash = { workspace = true }
lcc-layout = { workspace = true }
lcc-print = { workspace = true }
web-time = { workspace = true }
lcc-preview = { workspace = true }
lcc-codecs = { workspace = true }
lcc-raw = { workspace = true }
lcc-camdb = { workspace = true }
lcc-camprof = { workspace = true }
lcc-tiff = { workspace = true }
lcc-denoise-core = { workspace = true }
lcc-denoise = { workspace = true, optional = true }
lcc-meta = { workspace = true }
lcc-lensdb = { workspace = true }
lcc-faces = { workspace = true }
# the shared AI job queue and device choice (#491)
lcc-ml = { workspace = true }
miniz_oxide = { workspace = true }
lcc-merge = { workspace = true }
lcc-genfill = { workspace = true }
lcc-geocode = { workspace = true }
lcc-psd = { workspace = true }
lcc-actions = { workspace = true }
lcc-slideshow = { workspace = true }
tiff = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.12", default-features = false, features = ["std"] }
# Compose decomposed (NFD) text before it is laid out, one glyph per character.
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
lcc-segment = { workspace = true, optional = true }
lcc-tflite = { workspace = true, optional = true }
# video clips: probe and poster frames (every call is `Unsupported` on wasm32)
lcc-video = { workspace = true }
lcc-audio-out = { workspace = true }
# capture times: face recognition, and a Capture One catalog's offline originals (no clock: builds for wasm32 too)
chrono = { workspace = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lcc-fetch = { workspace = true }
lcc-genfill = { workspace = true, features = ["cloud"] }
# auto updates: the release feed, the download, and starting the install
lcc-updater = { workspace = true }
lcc-immich = { workspace = true }
# peer sync between devices on the local network (Settings ▸ Sync)
lcc-peer = { workspace = true }
lcc-sync = { workspace = true }
# peer sync: record digests
sha2 = { workspace = true }
lcc-publish = { workspace = true }
lcc-tether = { workspace = true }
lcc-credentials = { workspace = true }
lcc-webgallery = { workspace = true, features = ["sftp"] }
lcc-plugins = { workspace = true }
# M14.8: video clips in an export batch
lcc-video-export = { workspace = true }

# Delete from Disk (`photo.deleteFromDisk`): the system trash; the web and Android builds have none
# (`Session::trash` stays None)
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
trash = { workspace = true }

# free disk space of a volume (Folders panel)
[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
rustix = { workspace = true }

[features]
# Opt-in cpal sound for targets without a default path (macOS / Windows always use cpal, Linux and
# the BSDs PulseAudio; on Linux this adds cpal's libasound fallback, see docs/video.md).
audio-out = ["lcc-audio-out/audio-out"]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:lcc-segment", "dep:lcc-tflite"]
denoise = ["dep:lcc-denoise", "lcc-denoise/runtime", "lcc-gpu/denoise"]
rawnind-model = ["denoise", "lcc-denoise/rawnind-model", "lcc-denoise-core/rawnind-model"]
# Product-policy switch, like `rawnind-model`: offers the pinned Real-ESRGAN upscaler download for Super Resolution.
realesrgan-model = ["denoise", "lcc-denoise/realesrgan-model", "lcc-denoise-core/realesrgan-model"]
# The upstream project's own denoise model offered as a download (MIT OR Apache-2.0 weights, CC0 training data).
own-model = ["denoise", "lcc-denoise/own-model", "lcc-denoise-core/own-model"]
# Tests of other crates only: `Updater::trust_test_key` (the UI's update dialog), so they can stand in
# a throwaway update key for the brand's; `filter_plugins::install_in_memory` (the Plug-in Manager), so
# they install a pixel filter without a file in the plug-ins folder. Never enabled by an app build.
test-support = []

[dev-dependencies]
lcc-fuzzkit = { workspace = true }
# tests record why they skip (`cargo xtask ci` lists the skips)
lcc-testkit = { workspace = true }
# the catalog-upgrade test marks a store as an older build left it
redb = { workspace = true }
# genfill_check example: the mock provider fills with content-aware fill
lcc-inpaint = { workspace = true }
# HDR JPEG XL tests read the file's colour encoding
jxl-oxide = { workspace = true }
# the updater's end-to-end test builds a release with a real checksum, signed with a throwaway key
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
lcc-heif = { workspace = true, features = ["testdata"] }
# Synthetic VC-5 streams (the GoPro GPR import test).
lcc-raw = { workspace = true, features = ["testdata"] }
libc = { workspace = true }
lcc-tiff = { workspace = true }
wat = "1.228" # P4.3: plug-in test modules

# M14.2/M14.3/M14.8: synthetic clips generated in-test (no media committed) and re-decoded
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
lcc-video = { workspace = true, features = ["test-util"] }
# M14.4: the GPU playback LUT benchmark (bench_playback)
wgpu = { workspace = true }
pollster = { workspace = true }
filmcraft-h264enc = { git = "https://github.com/emmertex/filmcraft", rev = "3f0cb5f2a906087e5fdc1cd0bb685527da717ba4" }
filmcraft-isobmff = { git = "https://github.com/emmertex/filmcraft", rev = "3f0cb5f2a906087e5fdc1cd0bb685527da717ba4" }

[target.'cfg(windows)'.dependencies]
# free space on Windows (the Folders panel); its own unsafe FFI stays inside the crate
fs4 = { version = "1", default-features = false, features = ["sync"] }
