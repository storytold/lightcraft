[package]
name = "dac-faces"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft faces (L1): bounded ONNX CPU inference, face-model manifests, validation and detection"

[lints]
workspace = true

[features]
default = []

[dependencies]
ndarray = { version = "=0.17.2", default-features = false, features = ["std"] }
# Rust intrinsics only, CPU-dispatched; no BLAS, cc/assembly or nested threading.
matrixmultiply = { version = "=0.3.11", default-features = false, features = ["std", "avx512"] }
web-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
