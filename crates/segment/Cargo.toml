[package]
name = "dac-segment"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Segmentation: SAM 3 (Segment Anything with Concepts) inference in pure Rust (L3)"

[lints]
workspace = true

[dependencies]
dac-brand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# the model runs natively only (the web build has no AI masks)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
dac-fetch = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
