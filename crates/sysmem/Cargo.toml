[package]
name = "lightcraft-sysmem"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft sysmem (L0): returns freed allocator memory to the OS. An isolated helper allowed `unsafe` (one FFI call)."

# Opts out of the workspace lints only to keep `unsafe_code = "deny"` overridable for the single FFI
# module below. See AGENTS.md for the isolated helpers allowed unsafe code, and craftrules
# standards/never-crash.md ("isolated helper library crate").
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[dependencies]
