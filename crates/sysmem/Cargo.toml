[package]
name = "lightcraft-sysmem"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft sysmem (L0): returns freed allocator memory to the OS and reads the physical memory size. The workspace's only crate allowed `unsafe` (two FFI calls)."

# Opts out of the workspace lints only to keep `unsafe_code = "deny"` overridable for the single FFI
# module below; every other crate root has `#![forbid(unsafe_code)]`. See AGENTS.md.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[dependencies]
