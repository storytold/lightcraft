[package]
name = "lightcraft-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
lightcraft-denoise = { workspace = true, optional = true }
lightcraft-geom = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-faces = { workspace = true }
lightcraft-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
# the SAM 3 backbone kernels (`sam` feature) implement `lightcraft_segment::BackboneAccel`
lightcraft-segment = { workspace = true, optional = true }

[features]
default = []
denoise = ["dep:lightcraft-denoise", "lightcraft-denoise/runtime"]
# SAM 3's vision backbone on the GPU (`sam3`); the engine's `sam` feature turns it on
sam = ["dep:lightcraft-segment"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
lightcraft-scenes = { workspace = true }
lightcraft-raw = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# the SAM 3 backbone test and benchmark compare against the candle backbone
candle-core = { workspace = true }

[[example]]
name = "sam3_backbone_bench"
required-features = ["sam"]
