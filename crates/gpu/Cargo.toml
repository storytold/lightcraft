[package]
name = "lcc-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
lcc-brand = { workspace = true }
lcc-denoise = { workspace = true, optional = true }
lcc-geom = { workspace = true }
lcc-color = { workspace = true }
lcc-raster = { workspace = true }
lcc-develop = { workspace = true }
lcc-faces = { workspace = true }
lcc-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

[features]
default = []
denoise = ["dep:lcc-denoise", "lcc-denoise/runtime"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lcc-testkit = { workspace = true }
lcc-scenes = { workspace = true }
lcc-raw = { workspace = true }
