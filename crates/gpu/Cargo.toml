[package]
name = "dac-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
dac-denoise = { workspace = true, optional = true }
dac-geom = { workspace = true }
dac-color = { workspace = true }
dac-raster = { workspace = true }
dac-develop = { workspace = true }
dac-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

[features]
default = []
denoise = ["dep:dac-denoise", "dac-denoise/runtime"]

[dev-dependencies]
dac-scenes = { workspace = true }
