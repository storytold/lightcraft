[package]
name = "dac-credentials"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Secret storage (L0): the OS keychain where reachable in pure Rust, else a passphrase-encrypted file"

[dependencies]
dac-brand = { workspace = true }

[lints]
workspace = true

# Native only: on wasm32 the crate is empty (the web build stores no credentials).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = "1"
getrandom = "0.3"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# Linux and the BSDs: the freedesktop Secret Service over D-Bus, in pure Rust.
[target.'cfg(all(unix, not(target_os = "macos"), not(target_os = "ios"), not(target_os = "android")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
dac-fuzzkit = { workspace = true }
