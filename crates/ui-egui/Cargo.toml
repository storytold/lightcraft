[package]
name = "dac-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Egui frontend (Lightroom-style UI); swappable — nothing below depends on it (L5)"

[lints]
workspace = true

[dependencies]
dac-brand = { workspace = true }
dac-geom = { workspace = true }
dac-meta = { workspace = true }
dac-color = { workspace = true }
dac-raster = { workspace = true }
dac-develop = { workspace = true }
dac-pipeline = { workspace = true }
dac-catalog = { workspace = true }
web-time = { workspace = true }
dac-engine = { workspace = true }
dac-preview = { workspace = true }
dac-slideshow = { path = "../slideshow" }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dac-immich = { workspace = true }
dac-codecs = { workspace = true }
# identity plate graphic from an SVG (MIT/Apache-2.0, pure Rust); no text or system fonts
resvg = { version = "0.45", default-features = false }

[dev-dependencies]
dac-denoise = { workspace = true, features = ["runtime"] }
dac-codecs = { workspace = true }
dac-faces = { workspace = true }
dac-merge = { workspace = true }

[build-dependencies]
dac-brand = { workspace = true }
serde_json = { workspace = true }
toml = "1"
