[package]
name = "lcc-plugins"
description = "Sandboxed WebAssembly plug-ins: a resource-limited wasmi host with a capability-gated host API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Module digests: whether an update changed a plug-in's code (MIT OR Apache-2.0).
sha2 = { workspace = true }
# Plug-in versions: parsing and precedence (MIT OR Apache-2.0).
semver = "1.0.28"
# Pure-Rust WebAssembly interpreter (MIT OR Apache-2.0). `validate` keeps full module validation on.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lcc-net = { workspace = true }

[dev-dependencies]
# WebAssembly text -> binary for the hostile-module fixtures (Apache-2.0 WITH LLVM-exception).
wat = "1.228"
lcc-fuzzkit = { workspace = true }
# The SDK's manifest stamp tool (sdk/stamp, outside the workspace): stamped plug-ins load as before.
plugin-stamp = { path = "../../sdk/stamp" }
lcc-testkit = { workspace = true }
