[package]
name = "lightcraft-codecs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft standard image codecs: sniffing, decode to linear light, ICC, encoders (L1)"

[lints]
workspace = true

[dependencies]
lightcraft-geom = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
craft-gainmap = { workspace = true }
craft-cms = { workspace = true }
craft-image-codecs = { workspace = true }
craft-tiff = { workspace = true }
craft-gif = { workspace = true }
craft-psd = { workspace = true }
craft-heif = { workspace = true, optional = true }
serde = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true, optional = true }
craft-jxl = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-video = { workspace = true, optional = true }
craft-image-codecs = { workspace = true, features = ["avif"] }

[features]
default = ["parallel", "jxl", "avif"]
parallel = ["dep:rayon", "lightcraft-raster/parallel"]
## JPEG XL decoding and encoding via the shared craft-jxl codec.
jxl = ["dep:craft-jxl"]
# HEIC/HEIF decode via the optional craft-heif crate (heic-rs, pure Rust). Off by default so
# distributors choose it at build time (HEVC patents are a distributor's call, same policy as
# PhotoCraft); `cargo xtask ci` clippies and tests it (`--features heif`), releases don't ship it yet.
heif = ["dep:craft-heif"]
## AVIF/AV1 encoding via craft-image-codecs / craft-video (pure Rust). Native targets only; a no-op on wasm32.
avif = ["dep:craft-video"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
proptest = { workspace = true }
# Lossless synthetic HEIC files for the `heif` feature's tests.
craft-heif = { workspace = true, features = ["testdata"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
dhat = { workspace = true }
