[package]
name = "lightcraft-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft library: photos, albums, ratings/flags, search/filter/sort, op-log persistence (L3)"

[lints]
workspace = true

[dependencies]
lightcraft-develop = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raw = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
web-time = { workspace = true }

[features]
# `safe_file::without_hard_links`: test-only fault injection, turned on by the `[dev-dependencies]`
# of the crates whose tests use it, so a shipped binary can't call it.
fault-injection = []

[target.'cfg(windows)'.dependencies]
winapi-util = { workspace = true }

[dev-dependencies]
dhat = { workspace = true }
lightcraft-geom = { workspace = true }
lightcraft-testkit = { workspace = true }
proptest = { workspace = true }
