[package]
name = "dac-geo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Maps and places (L2): Web-Mercator tiles, tile servers, disk tile cache, clustering, tracks, saved locations, reverse geocoding"

[lints]
workspace = true

[dependencies]
dac-meta = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Native only: tile and geocoding requests (the web build talks to no servers).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dac-net = { workspace = true }
log = { workspace = true }

[dev-dependencies]
dac-fuzzkit = { workspace = true }
