[package]
name = "lcc-print"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Print module back end (L3): print jobs (single image / contact sheet, picture package, custom package) on lcc-layout, shaped text over lcc-text, PDF and JPEG output, and IPP printing to CUPS"

[lints]
workspace = true

[dependencies]
lcc-codecs = { workspace = true }
lcc-layout = { workspace = true }
lcc-net = { workspace = true }
lcc-pdf = { workspace = true }
lcc-raster = { workspace = true }
lcc-text = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
lcc-fuzzkit = { workspace = true }
lopdf = { version = "0.45", default-features = false }
lcc-brand = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
