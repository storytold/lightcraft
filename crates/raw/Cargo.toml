[package]
name = "lightcraft-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft RAW decoding, demosaicing and DNG colour model (L1)"

[lints]
workspace = true

[dependencies]
lightcraft-tiff = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-geom = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
miniz_oxide = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
jpeg-encoder = { workspace = true }
jxl-oxide = { workspace = true, optional = true }

[features]
default = ["jxl"]
## JPEG XL compressed DNGs (DNG 1.7, compression 52546) via jxl-oxide (pure Rust, MIT OR Apache-2.0).
jxl = ["dep:jxl-oxide"]
## `lightcraft_raw::testdata`: synthetic VC-5 (GoPro GPR) streams for other crates' tests.
testdata = []

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
proptest = { workspace = true }
zune-jpegxl = { workspace = true }
# Pinned CC0 corpus identities; not a product dependency.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
# Peak-heap regression tests (tests/sr2_heap.rs); not a product dependency.
dhat = { workspace = true }
