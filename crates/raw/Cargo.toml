[package]
name = "dac-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RAW decoding, demosaicing and DNG colour model (L1)"

[lints]
workspace = true

[dependencies]
dac-brand = { workspace = true }
dac-tiff = { workspace = true }
dac-meta = { workspace = true }
dac-raster = { workspace = true }
dac-color = { workspace = true }
dac-geom = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
miniz_oxide = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }
jxl-oxide = { workspace = true, optional = true }

[features]
default = ["jxl"]
## JPEG XL compressed DNGs (DNG 1.7, compression 52546) via jxl-oxide (pure Rust, MIT OR Apache-2.0).
jxl = ["dep:jxl-oxide"]

[dev-dependencies]
jpeg-encoder = { workspace = true }
proptest = { workspace = true }
zune-jpegxl = { workspace = true }
# Pinned CC0 corpus identities; not a product dependency.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
