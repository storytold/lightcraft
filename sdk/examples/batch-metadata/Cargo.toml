[package]
name = "batch-metadata"
description = "Example plug-in: batch titles and captions from a token template, and batch keywords, written through metadataWrite"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lcc-plugin-sdk = { path = "../../plugin" }

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
