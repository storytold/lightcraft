[package]
name = "publish-folder"
description = "Example plug-in: a publish service that publishes into a local gallery folder"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lcc-plugin-sdk = { path = "../../plugin" }

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
strip = true
